plugins {
    id 'java'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'
java {
    sourceCompatibility = 11
}

// кодировка файлов (если используете русский язык в файлах)
compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
        testImplementation 'io.rest-assured:rest-assured:5.3.1'
        testImplementation 'io.rest-assured:json-schema-validator:5.3.1'
        testImplementation 'io.rest-assured:rest-assured-common:5.3.1'
        testImplementation 'com.github.javafaker:javafaker:1.0.2'
        testImplementation 'org.projectlombok:lombok:1.18.28'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.28'
        testImplementation 'com.codeborne:selenide:6.18.0'
        testImplementation 'commons-dbutils:commons-dbutils:1.7'
        testImplementation 'mysql:mysql-connector-java:8.0.30'

    }
}

test {
    useJUnitPlatform()
    systemProperty 'selenide.headless', System.getProperty('selenide.headless')
    systemProperty 'chromeoptions.prefs', System.getProperty('chromeoptions.prefs', "profile.password_manager_leak_detection=false")
    systemProperty 'db.url',System.getProperty('db.url',"jdbc:mysql://host.docker.internal:3306/aqa_shop")
}